recipe: d1
question: Does a procedural matrix of other compositions lift held-out ones?
model: SpanNet
parameters_band: [900000, 1050000]
steps: 1200
batch: 12
lr: 0.0008
weight_decay: 0.01
eval_every: 100
eval_n: 80
final_n: 160
selection: mean AUROC of primitive, repeat, optional, alternation
loss: composition_loss
mix: half atomic, half composition matrix
allow_heldout_eval_families: false
repeat_cap: 3
edges:
  - class_repeat
  - repeat_suffix
  - optional_repeat
  - alt_suffix
  - repeat_repeat
  - optional_alt
  - class_alt
  - alt_repeat
seed: 0
